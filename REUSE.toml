version = 1

[[annotations]]
path = [
    "**/*.md",
    "CMakePresets.json",
    "vcpkg.json",
    "**/*.svg",
    "**/*.png",
    "**/*.gif",
    "**/*.ico",
    "**/*.k137",
]
SPDX-FileCopyrightText = "2026 Danius Kalvaitis"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = ["third_party/occt_qt/OcctGlTools.*", "third_party/occt_qt/OcctQtTools.*"]
precedence = "aggregate"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "third_party/occt_qt/LICENSE.txt"
SPDX-FileCopyrightText = "2023 Kirill Gavrilov"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "third_party/planegcs/Sketcher/App/planegcs/**"
precedence = "aggregate"
SPDX-License-Identifier = "LGPL-2.0-or-later"

[[annotations]]
path = "third_party/planegcs/LICENSE"
SPDX-FileCopyrightText = "1991, 1999 Free Software Foundation, Inc."
SPDX-License-Identifier = "LGPL-2.1-or-later"

[[annotations]]
path = ["third_party/roboto/*.ttf", "third_party/roboto/OFL.txt"]
SPDX-FileCopyrightText = "2011 The Roboto Project Authors (https://github.com/googlefonts/roboto-classic)"
SPDX-License-Identifier = "OFL-1.1"
