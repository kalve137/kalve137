name: Feature request
description: A tool, option or workflow Kalve 137 is missing
labels: ["type: feature"]
body:
  - type: textarea
    id: part
    attributes:
      label: Part
      description: The part or task you are modeling.
    validations:
      required: true
  - type: textarea
    id: missing
    attributes:
      label: Missing
      description: What you would like to do and how you work around it today.
    validations:
      required: true
