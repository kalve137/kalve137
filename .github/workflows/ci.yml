name: CI

on:
  push:
    branches: [dev, "release/*"]
    tags: ["v*"]
  schedule:
    - cron: "0 3 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check the version
        shell: pwsh
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: ./scripts/check-version.ps1 -Tag $env:TAG

  windows:
    name: Windows
    needs: version
    runs-on: windows-2025
    timeout-minutes: 300
    env:
      VCPKG_ROOT: C:\vcpkg-kalve137
      VCPKG_COMMIT: ec48c11eae9448c8c6e7739d93e06fa2433aa95f
      VCPKG_BINARY_SOURCES: clear;files,C:\vcpkg-cache,readwrite
      VCPKG_TRIPLET: x64-windows-release
      QT_VERSION: 6.10.2
      LLVM_VERSION: 22.1.8
      SOFTWARE_GL_DIR: C:\software-gl
    steps:
      - uses: actions/checkout@v7

      - name: Check licensing
        run: |
          pipx install "reuse[charset-normalizer]"
          reuse lint

      - name: Install LLVM
        run: choco install llvm --version=$env:LLVM_VERSION -y --no-progress --force

      - name: Check formatting
        run: ./scripts/format.ps1 -Check

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          dir: C:\
          cache: true

      - name: Add the Qt license text
        run: |
          $target = 'C:\Qt\Licenses\LICENSE'
          if (-not (Test-Path $target)) {
              New-Item -ItemType Directory -Force (Split-Path $target) | Out-Null
              Invoke-WebRequest "https://code.qt.io/cgit/qt/qtbase.git/plain/LICENSES/LGPL-3.0-only.txt?h=v$env:QT_VERSION" -OutFile $target
          }

      - name: Restore the vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: C:\vcpkg-cache
          key: vcpkg-${{ env.VCPKG_TRIPLET }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ env.VCPKG_TRIPLET }}-${{ env.VCPKG_COMMIT }}-

      - name: Bootstrap vcpkg
        run: |
          New-Item -ItemType Directory -Force C:\vcpkg-cache | Out-Null
          git clone https://github.com/microsoft/vcpkg $env:VCPKG_ROOT
          git -C $env:VCPKG_ROOT checkout $env:VCPKG_COMMIT
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

      - name: Build
        run: |
          . ./scripts/dev-shell.ps1
          cmake --preset windows-release "-DVCPKG_TARGET_TRIPLET=$env:VCPKG_TRIPLET"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset windows-release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Save the vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-primary-key != '' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: C:\vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Install software OpenGL
        run: |
          New-Item -ItemType Directory -Force $env:SOFTWARE_GL_DIR | Out-Null
          Copy-Item "$env:QT_ROOT_DIR\bin\opengl32sw.dll" "$env:SOFTWARE_GL_DIR\opengl32.dll"
          Copy-Item "$env:SOFTWARE_GL_DIR\opengl32.dll" build\windows-release

      - name: Test
        run: |
          . ./scripts/dev-shell.ps1
          ctest --preset windows-release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload UI screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-shots
          path: build/windows-release/ui-shots
          if-no-files-found: ignore

      - name: Package
        run: ./scripts/package.ps1 -SkipBuild -OpenGlDir $env:SOFTWARE_GL_DIR

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: kalve137-windows-x64
          path: build/windows-release/package/*.zip
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download the package
        uses: actions/download-artifact@v8
        with:
          name: kalve137-windows-x64
          path: package

      - name: Attach the package to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          version="${version%%-*}"
          prerelease=""
          if [[ "$TAG" == *-* ]]; then
              prerelease="--prerelease"
          fi
          zip="package/kalve137-${version}-windows-x64.zip"
          if [ ! -f "$zip" ]; then
              echo "No $zip, the tag does not match the project version"
              exit 1
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
              gh release upload "$TAG" "$zip" --clobber
              exit 0
          fi
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {found = 1; next} found && /^(## )?\[[^]]+\]/ {exit} found {print}' CHANGELOG.md > notes.md
          gh release create "$TAG" "$zip" --draft $prerelease --verify-tag --title "$TAG" --notes-file notes.md
